dataset:
  name: swe-bench-verified
  shard_count: 1
  split: /home/ch/SWE-bench/tasks.txt
logging:
  sample_hz:
    energy: 1
    memory: 1
models:
- name: gemini-api-via-openrouter
  provider: api
repetitions: 1
scaffolds:
- adapter: autocoderover
  env:
    ACR_ACTIVATE: . ~/miniconda3/etc/profile.d/conda.sh && conda activate auto-code-rover
    ACR_EXTRA_ARGS: --enable-validation
    ACR_FORWARD_ENV: OPENAI_KEY
    ACR_MODEL: gpt-5-nano
    ACR_MODEL_TEMPERATURE: '0.2'
    ACR_OUTPUT_DIR: $HARNESS_LOGS_DIR/acr_output
    ACR_ROOT: /home/ch/auto-code-rover
    ACR_RUNTIME: local
    ACR_SETUP_MAP: /home/ch/SWE-bench/setup_result/setup_map.json
    ACR_TASK: swe-bench
    ACR_TASKS_MAP: /home/ch/SWE-bench/setup_result/tasks_map.json
    ACR_TASK_ID: ''
    ACR_TASK_NAME: $ISSUE_ID
    OPENAI_API_KEY: api_key
  image: acr
  name: autocoderover
timeouts:
  per_issue_minutes: 5
