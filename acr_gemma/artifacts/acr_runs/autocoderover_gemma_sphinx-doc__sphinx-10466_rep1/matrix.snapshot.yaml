dataset:
  name: swe-bench-verified
  split: /home/sustaind/SWE-bench/tasks-mini.txt
logging:
  sample_hz:
    energy: 1
    memory: 1
models:
- name: gemma
  provider: llama
repetitions: 1
scaffolds:
- adapter: autocoderover
  env:
    ACR_ACTIVATE: . ~/miniconda3/etc/profile.d/conda.sh && conda activate auto-code-rover
    ACR_EXTRA_ARGS: --enable-validation
    ACR_FORWARD_ENV: OPENAI_API_BASE,OPENAI_API_KEY,OPENAI_KEY
    ACR_MODEL: litellm-gpt-4o-2024-05-13
    ACR_MODEL_TEMPERATURE: '0.2'
    ACR_OUTPUT_DIR: $HARNESS_LOGS_DIR/acr_output
    ACR_ROOT: /home/sustaind/auto-code-rover
    ACR_RUNTIME: local
    ACR_SETUP_MAP: /home/sustaind/SWE-bench/setup_result_mini/setup_map.json
    ACR_TASK: swe-bench
    ACR_TASKS_MAP: /home/sustaind/SWE-bench/setup_result_mini/tasks_map.json
    ACR_TASK_ID: ''
    ACR_TASK_NAME: $ISSUE_ID
    OPENAI_API_BASE: http://127.0.0.1:8080/v1
    OPENAI_API_KEY: sk-local-noop
    OPENAI_KEY: sk-local-noop
  image: acr
  name: autocoderover
timeouts:
  per_issue_minutes: 30
