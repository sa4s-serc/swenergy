dataset:
  name: swe-bench-verified
  shard_count: 1
  split: /home/ch/SWE-bench/tasks.txt
logging:
  sample_hz:
    energy: 1
    memory: 1
models:
- name: gemini-api-via-openrouter
  provider: api
repetitions: 1
scaffolds:
- adapter: openhands
  command: 'python -m openhands.core.main -f "$TASK_FILE" -d "$WORKSPACE_HOST_ABS"
    --max-iterations 40 --no-auto-continue

    '
  env:
    LLM_API_KEY: api_key
    LLM_MODEL: openai/gpt-4o-mini
    LOG_ALL_EVENTS: 'true'
    SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:0.57-nikolaik
    SWE_BENCH_IMAGE_PREFIX: docker.io/swebench/sweb.eval.x86_64
    SWE_BENCH_SETUP_MAP: /home/ch/SWE-bench/setup_result/setup_map.json
    SWE_BENCH_TASKS_MAP: /home/ch/SWE-bench/setup_result/tasks_map.json
    USE_INSTANCE_IMAGE: 'true'
  name: openhands
timeouts:
  per_issue_minutes: 20
